<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maximilian Schmahl</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="./include.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="./main.js" defer></script>
  <script src="./include.js"></script>

    <link type="text/css" rel="stylesheet" href="https://rawgit.com/patriciogonzalezvivo/glslEditor/gh-pages/build/glslEditor.css">
    <script type="application/javascript" src="https://rawgit.com/patriciogonzalezvivo/glslEditor/gh-pages/build/glslEditor.js"></script>


</head>

<body class="bg-[#f4f4f4] text-black antialiased">
  <div class="max-w-screen-sm mx-auto px-5 py-6"> <!-- MAIN CONTAINER -->
    
    <!-- HEADER -->
    <div id="header"></div>
    <script>include("header", "header.html")</script>

     <section id="glslEditor" class="space-y-6 mb-14">

      <script>
        // Initialize the GLSLEditor
        var editor = new GlslEditor('#editor', {
            canvas_size: 500,
            theme: 'monokai',
            multipleBuffers: false,
            watchHash: false
        });

        // Load a simple 2D shader
        editor.setCode(`
        #ifdef GL_ES
        precision mediump float;
        #endif

        uniform float u_time;
        uniform vec2 u_resolution;

        void main() {
            vec2 st = gl_FragCoord.xy / u_resolution;
            
            // Animated gradient
            float r = 0.5 + 0.5 * sin(u_time + st.x * 3.0);
            float g = 0.5 + 0.5 * sin(u_time + st.y * 3.0);
            float b = 0.5 + 0.5 * sin(u_time);

            gl_FragColor = vec4(r, g, b, 1.0);
        }
        `);
        </script>
      
    </section>

    <!-- CONTACT -->
    <div id="contact"></div>
    <script>include("contact", "contact.html")</script>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script>include("footer", "footer.html")</script>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const toggle = document.getElementById("navToggle");
    const menu = document.getElementById("mobileMenu");
    // Only attach handler if both elements are present. The header is loaded
    // asynchronously via `include()`, so these may be null at DOMContentLoaded.
    if (toggle && menu) {
      toggle.addEventListener("click", () => {
        menu.classList.toggle("hidden");
      });
    }
  });
</script>

</body>
</html>
