  <style>
    body {
  font-family: 'Source Sans Pro', sans-serif;
  font-weight: 400;
  font-size: 1.0rem;
  color: #666666;
 }

a {
    color: inherit;
    text-decoration: none;
}
a:hover {color: inherit;}

.content .item {
    display: inline-block;
    -webkit-opacity: 0;
    -webkit-transition: opacity .5s;
    -moz-transition: opacity .5s;
    transition: opacity .3s;
    transition: all 400ms cubic-bezier(0.0, 0.8, 0.8, 1);

    }
    .content .item.is-active {
        -webkit-transform: translate(0, 0);
        -webkit-opacity: 1; }


    .content .item p {
        margin-top: 0px;
        margin-bottom: 10px;
        color: inherit;
    }

.content:hover .item:hover {
    opacity: 0.7;
}


  </style>

  
</head>
<body>
  <!-- some design elements are inspired by https://patriciogonzalezvivo.com/ -->

  <script>
    //	Lunch Item Animation in Cascade
//
var counter=0;
var items=document.getElementsByClassName("item");
var images=[];

//	Avtivate Next Item
//
function activateNext(){
	var items = document.getElementsByClassName("item");
	if (counter < items.length ){
		items[counter].classList.add("is-active");
		counter++;
	}
}

if ( items.length > 0 ){
   	setInterval( activateNext ,400);
}
  </script>
